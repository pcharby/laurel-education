
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Laurel Education</title>
      <meta name="description" content="Laurel Education is a teacher-facing student assessment app for capturing observations and generating report card commentary." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <meta name="theme-color" content="#1A1A40" />

           registration is manual - see src/registerSW.ts. -->
      <!-- iOS Safari ignores most of the web manifest for "Add to Home Screen" - these cover it directly. -->
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="Laurel" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
